name: Plan Snowflake Infra
on:
  workflow_dispatch:
    inputs:
      targetEnvironment:
        type: choice
        description: Plan to
        options: 
        - dev
        - prod
        required: true
        default: 'dev'
      alwaysApplyGrants:
        type: choice
        description: Re-run all grants
        options: 
        - 'false'
        - 'true'
        required: true
        default: 'false'
      logDebug:
        type: choice
        description: TF_LOG debug level
        options:
        - TRACE
        - 'OFF'
        required: true
        default: 'OFF'
  workflow_call:
    inputs:
      targetEnvironment:
        required: false
        type: string
        default: dev
      alwaysApplyGrants:
        required: false
        type: string
        default: 'false'
      logDebug:
        required: false
        type: string
        default: 'OFF'

jobs:
  Plan:
    name: Plan Terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.targetEnvironment || github.event.inputs.targetEnvironment || 'dev' }}
    defaults:
      run:
        shell: bash
        working-directory: ./
    concurrency: infra-plan
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set terraform environment variables
      run: |
        # Fallback between workflow_call (inputs) and workflow_dispatch (github.event.inputs)
        TARGET_ENV="${{ inputs.targetEnvironment || github.event.inputs.targetEnvironment || 'dev' }}"
        LOG_DEBUG="${{ inputs.logDebug || github.event.inputs.logDebug || 'OFF' }}"
        
        echo "TF_LOG=$LOG_DEBUG" >> $GITHUB_ENV
        echo "BACKEND_ENCRYPT=true" >> $GITHUB_ENV
        echo "ENVIRONMENT=$TARGET_ENV" >> $GITHUB_ENV
        echo "SNOWFLAKE_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
        echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        role-duration-seconds: 900
        aws-region: us-east-1

    - name: install terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false

    - name: Initialize Terraform
      run: |
        terraform init -backend-config="./backends/backend-$ENVIRONMENT.tfvars"

    - name: Format terraform
      run: terraform fmt -check

    - name: Validate terraform
      run: terraform validate

    - name: Plan terraform
      run: |
        ALWAYS_APPLY="${{ inputs.alwaysApplyGrants || github.event.inputs.alwaysApplyGrants || 'false' }}"
        terraform plan --var-file="./environments/$ENVIRONMENT.tfvars" -var "always_apply=$ALWAYS_APPLY" -out=./output.tfplan
    #Comment